<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Macrotech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">

    <main class="card shadow border-0" style="width: 100%; max-width: 450px;">
        <div class="card-body p-5">
            
            
            <ul class="nav nav-pills nav-justified mb-4">
                <li class="nav-item">
                    <button class="nav-link active" id="btn-login">Connexion</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="btn-register">Inscription</button>
                </li>
            </ul>

            
            <form id="form-login">
                <div class="mb-3">
                    <label for="email-login" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email-login" required>
                </div>
                <div class="mb-4">
                    <label for="pwd-login" class="form-label">Mot de passe</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="pwd-login" required>
                        <span class="input-group-text cursor-pointer toggle-pwd" data-target="pwd-login">
                            <i class="bi bi-eye"></i>
                        </span>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Se connecter</button>
            </form>

            
            <form id="form-register" class="d-none">
                <div class="mb-3">
                    <label for="nom-register" class="form-label">Nom complet</label>
                    <input type="text" class="form-control" id="nom-register" required>
                </div>
                <div class="mb-3">
                    <label for="email-register" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email-register" required>
                </div>
                <div class="mb-3">
                    <label for="pwd-register" class="form-label">Mot de passe</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="pwd-register" required>
                        <span class="input-group-text cursor-pointer toggle-pwd" data-target="pwd-register">
                            <i class="bi bi-eye"></i>
                        </span>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="pwd-confirm" class="form-label">Confirmer le mot de passe</label>
                    <input type="password" class="form-control" id="pwd-confirm" required>
                    
                    <div id="pwd-error" class="invalid-feedback">Les mots de passe ne correspondent pas.</div>
                </div>
                <button type="submit" class="btn btn-success w-100" id="btn-submit-register">S'inscrire</button>
            </form>

            <div class="mt-4 text-center">
                <a href="../index.html" class="text-decoration-none text-muted"><i class="bi bi-arrow-left"></i> Retour à l'accueil</a>
            </div>

        </div>
    </main>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/validation.js"></script>
</body>
</html>
